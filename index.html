<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>Camera Lexicon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Kufi+Arabic:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
</head>
<body>
<style>
:root{
  --bg:#0a0f0c; --bg2:#0d1410; --surface:#111813; --surface2:#151d18; --line:#1f2a23; --line2:#2b3a30;
  --ink:#f3eadb; --ink2:#c5c1b8; --mute:#929b93; --amber:#e0b66f; --amber-dim:rgba(224,182,111,.14); --sage:#b9d5bd; --sage-ink:#07100c;
  --serif:"Newsreader",Georgia,"Times New Roman",serif; --sans:"Instrument Sans","Segoe UI",Arial,sans-serif; --mono:"JetBrains Mono",SFMono-Regular,Consolas,monospace;
  --kufi:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif; --arsans:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html{color-scheme:dark;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
body[dir=rtl]{font-family:var(--arsans)}
body[dir=rtl] h1,body[dir=rtl] h2,body[dir=rtl] h3,body[dir=rtl] .ttl{font-family:var(--kufi)}
a{color:var(--amber)}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:1360px;margin:0 auto;padding:0 24px}
.mono{font-family:var(--mono)}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
[hidden]{display:none!important}

/* top nav */
nav{display:flex;align-items:center;justify-content:space-between;padding:18px 0}
nav .brand{font-family:var(--serif);font-size:20px;font-weight:500;letter-spacing:-.01em}
nav .brand span{color:var(--amber)}
nav .links{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:var(--r);padding:11px 18px;font-weight:600;font-size:14px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);text-decoration:none;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--mute)}
.btn.primary{background:var(--sage);color:var(--sage-ink);border-color:var(--sage)}
.btn.primary:hover{background:#cbe3cf}
.btn.sm{padding:8px 14px;font-size:13px}
.lang{display:flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.lang button{background:transparent;border:0;color:var(--mute);padding:8px 12px;font-size:13px;font-family:var(--mono)}
.lang button.on{background:var(--amber);color:#1a1409}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;padding:28px 0 56px}
.pill{display:inline-block;border:1px solid var(--line2);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--ink2);background:var(--surface)}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(44px,6vw,84px);line-height:1;letter-spacing:-.02em;margin:18px 0 22px;text-wrap:balance}
h1 em{font-style:italic;color:var(--amber)}
body[dir=rtl] h1{font-size:clamp(36px,5vw,64px);line-height:1.25;letter-spacing:0}
.hero p.lead{color:var(--ink2);font-size:17px;max-width:58ch;margin:0 0 24px}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.hero .note{color:var(--mute);font-size:13px;max-width:52ch}
.frame-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
.frame-card h3{font-family:var(--sans);font-size:20px;font-weight:600;margin:6px 0 14px}
.frame-card .img{border-radius:10px;overflow:hidden;aspect-ratio:16/9;background:#000;border:1px solid var(--line2)}
.frame-card .img img{width:100%;height:100%;object-fit:cover;display:block}
.frame-card p{color:var(--mute);font-size:13px;margin:12px 0 0}

/* library header */
.lib-h{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;padding:36px 0 18px;border-top:1px solid var(--line)}
.lib-h h2{font-family:var(--serif);font-weight:500;font-size:clamp(30px,3.6vw,46px);margin:6px 0 10px;letter-spacing:-.015em;line-height:1.1}
.lib-h p{color:var(--ink2);margin:0;max-width:60ch}
.stats{display:flex;gap:28px}
.stat{text-align:center}
.stat b{display:block;font-family:var(--serif);font-size:38px;font-weight:500;line-height:1;color:var(--ink)}
.stat span{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--mute)}

/* filter bar */
.bar{position:sticky;top:0;z-index:20;background:rgba(10,15,12,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin:0 -24px;padding:12px 24px}
.bar .in{max-width:1360px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:220px;max-width:360px}
.search input{width:100%;background:var(--surface);border:1px solid var(--line2);color:var(--ink);padding:10px 14px;border-radius:var(--r);font-family:inherit;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:transparent;border:1px solid var(--line2);color:var(--ink2);padding:7px 13px;border-radius:999px;font-size:13px;display:flex;gap:8px;align-items:center}
.chip b{font-family:var(--mono);font-weight:500;font-size:11px;color:var(--mute)}
.chip.on{background:var(--amber);border-color:var(--amber);color:#1a1409}.chip.on b{color:#5a4210}
.tog{background:transparent;border:1px solid var(--line2);color:var(--ink2);padding:7px 13px;border-radius:999px;font-size:13px}
.tog.on{border-color:var(--amber);color:var(--amber)}

/* cards */
section.cat{padding:30px 0 6px}
.cat-h{display:flex;align-items:baseline;gap:14px;margin-bottom:16px}
.cat-h h3{font-family:var(--serif);font-weight:500;font-size:28px;margin:0;letter-spacing:-.01em}
.cat-h p{margin:0;color:var(--mute);font-size:14px;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--line2);transform:translateY(-2px)}
.card .media{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden;border-bottom:1px solid var(--line)}
.card .media img{width:100%;height:100%;object-fit:cover;display:block}
.media.fit img{object-fit:contain;background:#000}
.card .media svg.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.card .media .pend{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,15,12,.55);font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--amber)}
.card .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px}
.card .meta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--mute);text-transform:uppercase}
.card .meta .cat{color:var(--amber)}
.card .ttl{font-size:20px;font-weight:600;margin:0;line-height:1.25;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.card .ttl .star{background:none;border:0;color:var(--mute);font-size:16px;padding:0}
.card.faved .ttl .star{color:var(--amber)}
.card .sub{color:var(--mute);font-size:13.5px;line-height:1.5;margin:-4px 0 0}
.prompt{background:#070c09;border:1px solid var(--line2);border-radius:8px;padding:12px 14px;font-family:var(--mono);font-size:12px;line-height:1.6;direction:ltr;text-align:left;color:var(--ink2);white-space:pre-wrap;max-height:150px;overflow:auto}
.prompt mark{background:var(--amber-dim);color:var(--amber);padding:0 3px;border-radius:3px}
.card .acts{display:flex;gap:8px;flex-wrap:wrap}
.empty{color:var(--mute);padding:50px 0;text-align:center}

/* drawer */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40}
.dr{position:fixed;top:0;bottom:0;width:min(760px,100%);background:var(--bg2);z-index:50;overflow-y:auto;transition:transform .22s ease;right:0;transform:translateX(100%);border-left:1px solid var(--line2)}
body[dir=rtl] .dr{right:auto;left:0;transform:translateX(-100%);border-left:0;border-right:1px solid var(--line2)}
.dr.open{transform:none}
.dr .in{padding:24px 28px 48px;display:flex;flex-direction:column;gap:20px}
.dr .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dr h3{font-family:var(--serif);font-weight:500;font-size:34px;margin:4px 0 2px;line-height:1.1;letter-spacing:-.01em}
.dr .sub2{font-family:var(--mono);font-size:12px;color:var(--mute)}
.x{background:var(--surface);border:1px solid var(--line2);color:var(--ink);width:38px;height:38px;border-radius:10px;font-size:18px;flex:none}
.dr .media{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:16/9;background:#000;border:1px solid var(--line)}
.dr .media img{width:100%;height:100%;object-fit:cover;display:block}
.dr .media.fit img{object-fit:contain;background:#000}
.dr .media svg.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.blk p{margin:0;color:var(--ink2)}
.blk ul{margin:0;padding-inline-start:18px;color:var(--ink2)}
.blk .lbl{display:block;margin-bottom:8px}
.dr .prompt{max-height:none;font-size:12.5px}
.tip{background:rgba(185,213,189,.08);border-inline-start:3px solid var(--sage);padding:12px 16px;border-radius:0 8px 8px 0}
.tip ul{margin:0;padding-inline-start:18px;color:var(--ink2);font-size:14px}
.film{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:start}
.film .t{font-family:var(--serif);font-size:22px;font-weight:500}
.film .t span{color:var(--mute);font-size:16px}
.film .meta{font-family:var(--mono);font-size:11.5px;color:var(--mute)}
.film .sc{color:var(--ink2);font-size:14px;grid-column:1/-1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* builder */
#builder{padding:56px 0 40px;border-top:1px solid var(--line);margin-top:40px}
#builder h2{font-family:var(--serif);font-weight:500;font-size:clamp(34px,4.5vw,60px);line-height:1.02;letter-spacing:-.02em;margin:8px 0 12px;max-width:16ch}
#builder p.lead{color:var(--ink2);max-width:62ch;margin:0 0 26px}
.bgrid{display:grid;grid-template-columns:1fr 1.4fr;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.drop{border:1.5px dashed var(--line2);border-radius:12px;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;cursor:pointer;color:var(--mute);position:relative;overflow:hidden}
.drop b{color:var(--ink);font-size:17px;display:block;margin-bottom:6px}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.drop input{display:none}
.drop.has{border-style:solid}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.f label{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.f select,.f input,.f textarea{background:var(--bg);border:1px solid var(--line2);color:var(--ink);padding:11px 12px;border-radius:8px;font-family:inherit;font-size:14px}
.f textarea{min-height:80px;resize:vertical;font-family:var(--mono);font-size:12.5px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
#bout{min-height:120px;max-height:none}
footer{color:var(--mute);font-size:12.5px;padding:28px 0 48px;border-top:1px solid var(--line);margin-top:20px;max-width:80ch}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--sage);color:var(--sage-ink);padding:9px 18px;border-radius:999px;font-weight:600;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.show{opacity:1}
@media (max-width:900px){.hero,.bgrid,.lib-h{grid-template-columns:1fr}.stats{justify-content:flex-start}}
@media (prefers-reduced-motion:reduce){.card,.dr{transition:none} svg *{animation:none!important}}
</style>

<div class="wrap">
<nav>
  <div class="brand">Camera <span>Lexicon</span></div>
  <div class="links">
    <a class="btn sm" href="#library" data-i="nav_lib"></a>
    <a class="btn sm" href="#builder" data-i="nav_build"></a>
    <div class="lang"><button id="lang-en" class="on">EN</button><button id="lang-ar">عربي</button></div>
  </div>
</nav>

<header class="hero">
  <div>
    <span class="pill" data-i="pill"></span>
    <h1 id="h1"></h1>
    <p class="lead" data-i="lead"></p>
    <div class="cta"><a class="btn primary" href="#library" data-i="cta1"></a><a class="btn" href="#builder" data-i="cta2"></a></div>
    <p class="note" data-i="note"></p>
  </div>
  <div class="frame-card">
    <span class="lbl" data-i="mf_lbl"></span>
    <h3 data-i="mf_h"></h3>
    <div class="img"><img id="masterimg" src="img/master.jpg" alt="Master first frame"></div>
    <p data-i="mf_p"></p>
  </div>
</header>

<div class="lib-h" id="library">
  <div><span class="lbl" data-i="lib_lbl"></span><h2 data-i="lib_h"></h2><p data-i="lib_p"></p></div>
  <div class="stats"><div class="stat"><b id="st1">76</b><span data-i="st_stills"></span></div><div class="stat"><b>6</b><span data-i="st_cats"></span></div><div class="stat"><b>1</b><span data-i="st_prompt"></span></div></div>
</div>

<div class="bar"><div class="in">
  <div class="search"><input id="q" data-ph="search"></div>
  <div class="chips" id="chips"></div>
  <button class="tog" id="favtog">★ <span data-i="favs"></span></button>
</div></div>

<main id="main"></main>

<section id="builder">
  <span class="lbl" data-i="b_lbl"></span>
  <h2 data-i="b_h"></h2>
  <p class="lead" data-i="b_p"></p>
  <div class="bgrid">
    <div class="panel">
      <label class="drop" id="drop"><input type="file" id="file" accept="image/*"><b data-i="b_drop_b"></b><span data-i="b_drop_s"></span></label>
      <p style="color:var(--mute);font-size:12.5px;margin:12px 0 0" data-i="b_drop_note"></p>
    </div>
    <div class="panel">
      <div class="f2">
        <div class="f"><label data-i="b_move"></label><select id="b_move"></select></div>
        <div class="f"><label data-i="b_size"></label><select id="b_size"></select></div>
        <div class="f"><label data-i="b_angle"></label><select id="b_angle"></select></div>
        <div class="f"><label data-i="b_lens"></label><select id="b_lens"></select></div>
        <div class="f"><label data-i="b_format"></label><select id="b_format"></select></div>
        <div class="f"><label data-i="b_frame"></label><select id="b_frame"></select></div>
      </div>
      <div class="f"><label data-i="b_ctx"></label><textarea id="b_ctx" data-ph="b_ctx_ph"></textarea></div>
      <div class="f2">
        <div class="f"><label data-i="b_subject"></label><input id="b_subject" data-ph="b_subject_ph"></div>
        <div class="f"><label data-i="b_location"></label><input id="b_location" data-ph="b_location_ph"></div>
        <div class="f"><label data-i="b_action"></label><input id="b_action" data-ph="b_action_ph"></div>
        <div class="f"><label data-i="b_mood"></label><input id="b_mood" data-ph="b_mood_ph"></div>
      </div>
      <div class="f"><label data-i="b_out"></label><div class="prompt" id="bout"></div></div>
      <div class="row"><button class="btn primary" id="bcopy" data-i="b_copy"></button><button class="btn" id="breset" data-i="b_reset"></button></div>
    </div>
  </div>
</section>

<footer data-i="foot"></footer>
</div>

<div class="ov" id="ov" hidden></div>
<aside class="dr" id="dr"><div class="in" id="drin"></div></aside>
<div class="toast" id="toast"></div>

<script src="src/data.js"></script>
<script src="src/en.js"></script>
<script src="src/prompts.js"></script>
<script src="src/still-prompts.js"></script>
<script src="src/app.js"></script>

</body>
</html>
